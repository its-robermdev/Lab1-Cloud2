name: DevSecOps Pipeline 

  
on: 

  push: 

    branches: [ main, develop ] 

  pull_request: 

    branches: [ main, develop ] 

  

permissions: 

  contents: read 

  security-events: write 

  actions: read 

  

jobs: 

  codeql-analysis: 

    name: Análisis Estático (CodeQL) 

    runs-on: ubuntu-latest 

    steps: 

      - uses: actions/checkout@v4 

      - uses: github/codeql-action/init@v3 

        with: 

          languages: javascript, python 

      - uses: github/codeql-action/analyze@v3 

  

  trivy-scan: 

    name: Escaneo de Vulnerabilidades (Trivy) 

    runs-on: ubuntu-latest 

    needs: codeql-analysis 

    steps: 

      - uses: actions/checkout@v4 

      - uses: aquasecurity/trivy-action@master 

        with: 

          scan-type: 'fs' 

          scan-ref: '.' 

          format: 'sarif' 

          output: 'trivy-fs-report.sarif' 

          severity: 'CRITICAL,HIGH' 

      - run: docker build -t mi-app:ci . 

      - uses: aquasecurity/trivy-action@master 

        with: 

          image-ref: 'mi-app:ci' 

          format: 'table' 

          severity: 'CRITICAL,HIGH' 

          output: 'trivy-image-report.txt' 

      - uses: actions/upload-artifact@v4 

        with: 

          name: trivy-reports 

          path: | 

            trivy-fs-report.sarif 

            trivy-image-report.txt 

  

  gitleaks-scan: 

    name: Detección de Secretos (Gitleaks) 

    runs-on: ubuntu-latest 

    steps: 

      - uses: actions/checkout@v4 

        with: 

          fetch-depth: 0 

      - uses: gitleaks/gitleaks-action@v2 

        env: 

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true 

  

  generate-sbom: 

    name: Generación de SBOM 

    runs-on: ubuntu-latest 

    needs: trivy-scan 

    steps: 

      - uses: actions/checkout@v4 

      - uses: anchore/sbom-action@v0 

        with: 

          path: . 

          format: cyclonedx-json 

          output-file: sbom.cyclonedx.json 

      - uses: actions/upload-artifact@v4 

        with: 

          name: sbom-report 

          path: sbom.cyclonedx.json 

  

  security-gate: 

    name: Política de Seguridad (Quality Gate) 

    runs-on: ubuntu-latest 

    needs: [trivy-scan, gitleaks-scan] 

    steps: 

      - uses: actions/checkout@v4 

      - uses: aquasecurity/trivy-action@master 

        with: 

          scan-type: 'fs' 

          scan-ref: '.' 

          severity: 'CRITICAL' 

          exit-code: '1' 

          ignore-unfixed: true 